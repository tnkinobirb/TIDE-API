[project]
name = "tide-api"
version = "0.0.5"
description = "FastAPI interface for TIDE execution traces"
readme = "README.md"
authors = [
    { name = "Gabriel Dolbear", email = "tidetooling@gmail.com" },
]
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = ["LICENCE.md"]

dependencies = [
    "fastapi[standard]>=0.112.0",
    "psycopg[binary,pool]>=3.2",
    "python-dotenv>=1.0",
    "tide-tooling @ git+https://github.com/tnkinobirb/TIDE-Tooling.git@8c7edc17a50deb4bf312e113b726a3bcadbc1bc9",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
]

[project.urls]
Repository = "https://github.com/tnkinobirb/TIDE-API"

[tool.setuptools.packages.find]
where = ["."]
include = ["tideapi*", "tideapi_core*"]

[tool.pytest.ini_options]
testpaths = ["testing"]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"
