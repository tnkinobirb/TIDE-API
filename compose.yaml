services:
  tide-api:
    build: .
    env_file:
      - path: tideapi.env
        required: false
    environment:
      TIDEAPI_BUNDLE_DIR: /app/bundles
      TIDEAPI_SQLITE_DB_PATH: /app/data/bundles.db
      TIDEAPI_PSQL_HOST: postgres
      TIDEAPI_PSQL_DB_PASSWORD: ${TIDEAPI_PSQL_DB_PASSWORD}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/:/app/data
      - ./bundles:/app/bundles:ro

  postgres:
    image: postgres:18
    env_file:
      - .env
      - postgres.env
    environment:
      POSTGRES_USER: tideapiadmin
      POSTGRES_DB: bundles
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - type: bind
        source: ./tideapi_core/persistence/postgres/init.sql
        target: /docker-entrypoint-initdb.d/init.sql
        read_only: true
        bind:
          create_host_path: false

volumes:
  postgres-data: