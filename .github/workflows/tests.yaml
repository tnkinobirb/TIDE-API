name: TIDE-API Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TIDEAPI_TEST_PSQL: "1"
      TIDEAPI_STORE_BACKEND: sqlite3
      TIDEAPI_PSQL_DB_PASSWORD: ci-app-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install ".[test]"

      - name: Start PostgreSQL
        run: |
          printf 'TIDEAPI_PSQL_DB_PASSWORD=ci-app-password\n' > .env
          printf 'POSTGRES_PASSWORD=ci-admin-password\n' > postgres.env
          docker compose up -d --wait --wait-timeout 120 postgres

      - name: Run tests
        run: python -m pytest -q

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down -v
